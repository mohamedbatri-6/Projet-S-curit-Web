name: Security checks

on:
  push:
    branches:
      - secure
  pull_request:
    branches:
      - secure

jobs:
  test-and-scan:
    runs-on: ubuntu-latest

    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Backend tests
        working-directory: backend
        run: npm test

      - name: Frontend tests
        working-directory: frontend
        run: npm test

      - name: Frontend build
        working-directory: frontend
        run: npm run build

      - name: Backend dependency audit
        working-directory: backend
        run: npm audit --audit-level=critical

      - name: Frontend dependency audit
        working-directory: frontend
        run: npm audit --audit-level=critical

      - name: Semgrep SAST
        uses: semgrep/semgrep-action@v1
        with:
          config: p/owasp-top-ten

      - name: Gitleaks secret scanning
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Seed DAST database
        working-directory: backend
        env:
          MONGODB_URI: mongodb://127.0.0.1:27017/support_ticket_security
          JWT_SECRET: ci-test-secret
        run: npm run seed

      - name: Start backend for DAST
        working-directory: backend
        env:
          PORT: 4000
          MONGODB_URI: mongodb://127.0.0.1:27017/support_ticket_security
          JWT_SECRET: ci-test-secret
          FRONTEND_ORIGIN: http://localhost:3001
        run: |
          npm start > ../backend-dast.log 2>&1 &
          for i in {1..30}; do
            curl -fsS http://localhost:4000/ && exit 0
            sleep 2
          done
          cat ../backend-dast.log
          exit 1

      - name: Start frontend for DAST
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: http://localhost:4000
        run: |
          npm start -- -p 3001 > ../frontend-dast.log 2>&1 &
          for i in {1..30}; do
            curl -fsS http://localhost:3001/ && exit 0
            sleep 2
          done
          cat ../frontend-dast.log
          exit 1

      - name: OWASP ZAP baseline DAST
        uses: zaproxy/action-baseline@v0.14.0
        continue-on-error: true
        with:
          target: http://localhost:3001
          cmd_options: '-a'
